[project]
name = "sqlgen"
version = "0.1.0"
description = "Learning from-scratch text-to-SQL modeling and distributed training"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "modal==1.6.3",
    "wandb==0.31.0",
]

[dependency-groups]
model = ["torch==2.10.0"]

[tool.uv]
package = false
required-version = ">=0.12.3"
default-groups = ["model"]

# macOS uses PyPI's native build; Linux/Windows use an explicit CUDA build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
